<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hobbies</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="resources/css/styles.css">
</head>


<body>
  <header>
    <h1>My Hobbies</h1>
  </header>

<nav class="navbar navbar-expand">
  <div class="container-fluid">
    <div class="navbar-nav">
      <a class="nav-link" href="home.html">Home</a>
      <a class="nav-link" href="hobbies.html">Hobbies</a>
      <a class="nav-link" href="projects.html">Projects</a>
      <a class="nav-link" href="resume.html">Resume</a>
    </div>
  </div>
</nav>

<main class="container my-4">
  <div class="row g-3">

<section class="col-12 col-md-4">
  <div class="card h-100">
    <img src="resources/img/hiking.png" class="card-img-top" alt="Hiking outdoors">

    <div class="card-body">
      <h2 class="card-title">Hiking</h2>

      <button class="btn btn-dark"
              type="button"
              data-bs-toggle="collapse"
              data-bs-target="#hikingDescription">
        Show description
      </button>

      <div class="collapse mt-3" id="hikingDescription">
        <p class="card-text">I enjoy getting outside and exploring new trails.</p>
      </div>
    </div>
  </div>
</section>

<section class="col-12 col-md-4">
  <div class="card h-100">
    <img src="resources/img/biking.png" class="card-img-top" alt="Biking outdoors">

    <div class="card-body">
      <h2 class="card-title">Biking</h2>

      <button class="btn btn-dark"
              type="button"
              data-bs-toggle="collapse"
              data-bs-target="#bikingDescription">
        Show description
      </button>

      <div class="collapse mt-3" id="bikingDescription">
        <p class="card-text">I enjoy biking around town and finding big hills.</p>
      </div>
    </div>
  </div>
</section>

<section class="col-12 col-md-4">
  <div class="card h-100">
    <img src="resources/img/film.png" class="card-img-top" alt="Watching a movie">

    <div class="card-body">
      <h2 class="card-title">Movies</h2>

      <button class="btn btn-dark"
              type="button"
              data-bs-toggle="collapse"
              data-bs-target="#moviesDescription">
        Show description
      </button>

      <div class="collapse mt-3" id="moviesDescription">
        <p class="card-text">I enjoy watching movies, especially Christopher Nolan movies.</p>
      </div>
    </div>
  </div>
</section>

  </div>
</main>

  <footer>
    <p>© 2026 Zach Cassidy</p>
    <a href="https://github.com/zcassidy7" class="button">GitHub</a>
  </footer>

<!--
Bootstrap annotations:

container: Centers the main content and provides responsive spacing.

col-md-4: Makes each hobby use 4 of Bootstrap's 12 columns on medium and larger screens.

card: Styles each hobby as a Bootstrap card.
-->



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
